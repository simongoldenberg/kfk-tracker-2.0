<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KFK-Tracker · Ergebnistabelle</title>
<link rel="icon" type="image/png" sizes="192x192" href="kfk-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4; --bg-2: #f4eee3; --bg-3: #e9ddc9; --surface: #ffffff;
    --ink: #1f1c17; --ink-muted: #635c50; --ink-faint: #82796a;
    --line: #e1dbcf; --line-strong: #c7bfae;
    --accent: #143c46; --accent-dark: #0d2830; --accent-2: #3d7376;
    --moss: #5a7237; --moss-bg: #e2e9d2;
    --warn: #c3903f; --warn-bg: #f7e9d3;
    --ok: #5a7237; --err: #b9633f; --err-bg: #f3ddd4;
    --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px;
    --shadow-sm: 0 1px 3px rgba(20,28,26,.06); --shadow-md: 0 4px 18px rgba(20,28,26,.09);
  }
  :root[data-theme="dark"] {
    --bg: #14120e; --bg-2: #1c1913; --bg-3: #262117; --surface: #201c16;
    --ink: #f4f0e6; --ink-muted: #a49b88; --ink-faint: #7d7566;
    --line: #3a352c; --line-strong: #4a4438;
    --accent: #8aa85c; --accent-dark: #6f8a49; --accent-2: #6fa3a6;
    --moss: #8aa85c; --moss-bg: #262a1c;
    --warn: #d1954a; --warn-bg: #2c2317;
    --ok: #8aa85c; --err: #d9755a; --err-bg: #2c1e18;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 18px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="dark"]) {
      --bg: #14120e; --bg-2: #1c1913; --bg-3: #262117; --surface: #201c16;
      --ink: #f4f0e6; --ink-muted: #a49b88; --ink-faint: #7d7566;
      --line: #3a352c; --line-strong: #4a4438;
      --accent: #8aa85c; --accent-dark: #6f8a49; --accent-2: #6fa3a6;
      --moss: #8aa85c; --moss-bg: #262a1c;
      --warn: #d1954a; --warn-bg: #2c2317;
      --ok: #8aa85c; --err: #d9755a; --err-bg: #2c1e18;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 18px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    font-size: 16px; line-height: 1.5;
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 20px 60px; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  header h1 { font-size: 24px; margin: 0 0 2px; }
  header .sub { color: var(--ink-muted); font-size: 14px; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  a.btn, button.btn {
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 8px 12px; font-weight: 700; font-size: 14px; cursor: pointer;
    font-family: inherit;
  }
  a.btn:hover, button.btn:hover { border-color: var(--line-strong); }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  #search {
    flex: 1; min-width: 220px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); font-size: 15px;
  }
  .status-msg { padding: 40px 20px; text-align: center; color: var(--ink-muted); font-style: italic; }
  .status-msg.err { color: var(--err); }
  table.ergebnisse {
    width: 100%; border-collapse: collapse; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden;
  }
  table.ergebnisse th {
    text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--ink-muted); background: var(--bg-2); padding: 10px 12px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  table.ergebnisse td {
    padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px;
  }
  table.ergebnisse tbody tr.row-main { cursor: pointer; }
  table.ergebnisse tbody tr.row-main:hover { background: var(--bg-2); }
  table.ergebnisse tbody tr:last-child td { border-bottom: none; }
  .muted { color: var(--ink-muted); }
  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
  }
  .badge.ok { background: var(--moss-bg); color: var(--moss); }
  .badge.wait { background: var(--warn-bg); color: var(--warn); }
  .badge.none { background: var(--err-bg); color: var(--err); }
  .kf-bars { display: flex; flex-direction: column; gap: 3px; min-width: 160px; }
  .kf-bar-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .kf-bar-row .code { min-width: 26px; font-weight: 700; }
  .kf-bar-track { flex: 1; height: 8px; background: var(--bg-3); border-radius: 4px; overflow: hidden; }
  .kf-bar-fill { height: 100%; border-radius: 4px; }
  .kf-bar-row .pct { min-width: 34px; text-align: right; font-weight: 700; }
  .detail-row td { background: var(--bg-2); padding: 16px 20px; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .detail-block h4 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-muted); margin: 0 0 6px;
  }
  .detail-block p { margin: 0; white-space: pre-wrap; font-size: 14px; }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .detail-table th, .detail-table td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  .updated { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
  ::selection { background: var(--accent); color: #fff; }
  .cmp-cell { width: 30px; text-align: center; }
  .cmp-cell input { width: 16px; height: 16px; cursor: pointer; }
  select#sortBy {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--ink); font-size: 14px; font-family: inherit; cursor: pointer;
  }
  .cmp-bar {
    display: none; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 14px;
    background: var(--moss-bg); border: 1px solid var(--line); border-radius: var(--radius-md); flex-wrap: wrap;
  }
  .cmp-bar.active { display: flex; }
  .cmp-bar .count { font-weight: 700; }
  .kategorie-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
    background: var(--bg-3); color: var(--ink-muted);
  }
  .standorte-list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .standorte-list li { padding: 2px 0; }
  .cmp-overlay {
    position: fixed; inset: 0; background: rgba(20,18,14,.5); z-index: 50;
    display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto;
  }
  .cmp-modal {
    background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
    max-width: 1200px; width: 100%; padding: 20px 24px;
  }
  .cmp-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cmp-modal-header h2 { font-size: 18px; margin: 0; }
  .cmp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cmp-table th, .cmp-table td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .cmp-table th { color: var(--ink-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Ergebnistabelle</h1>
      <div class="sub" id="header-sub">lädt…</div>
    </div>
    <div class="header-actions">
      <a class="btn" href="index.html">← Zurück zum Tracker</a>
      <button class="btn" id="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>
      <button class="btn" onclick="loadData()">⟳ Aktualisieren</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Suche nach Versuchsnr, Titel, Art, Status…" oninput="renderTable()">
    <select id="sortBy" onchange="renderTable()">
      <option value="versuchsnr_desc">Sortierung: Versuchsnr (neu → alt)</option>
      <option value="art">Sortierung: Art</option>
      <option value="kategorie">Sortierung: Kategorie (A–D)</option>
    </select>
  </div>

  <div class="cmp-bar" id="cmp-bar">
    <span><span class="count" id="cmp-count">0</span> Versuche ausgewählt</span>
    <button class="btn" onclick="openCompare()">Vergleichen</button>
    <button class="btn" onclick="clearCompare()">Auswahl aufheben</button>
  </div>

  <div id="content"><div class="status-msg">lädt…</div></div>
</div>

<div id="cmp-overlay" class="cmp-overlay" style="display:none" onclick="if(event.target===this) closeCompare()">
  <div class="cmp-modal">
    <div class="cmp-modal-header">
      <h2>Versuchsvergleich</h2>
      <button class="btn" onclick="closeCompare()">Schließen</button>
    </div>
    <div id="cmp-content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/standorte.js"></script>
<script>
// ============ Konfiguration ============
// Gleiche Supabase-Instanz wie im Tracker selbst (js/supabase-sync.js) - der
// publishable/anon Key ist bewusst oeffentlich, Schutz kommt ausschliesslich
// ueber Row Level Security (siehe CLAUDE.md, Abschnitt "Supabase-Spiegelung").
const SUPABASE_URL = 'https://vtyuppwmixepdwxjooiw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_5pQqKGLOclmv1LSzOZEcHw_L3q9MyeT';
const THEME_KEY = 'kfk_theme';

(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
})();
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
}

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let rows = [];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Kumulative KF% pro Treatment aus dem vollen Snapshot (kfk_data.daten) -
// Zaehlverfahren ist additiv (siehe CLAUDE.md "Zaehlverfahren (AZ)"): Summe
// aller bisher erfassten AZ-Runden / Samen-pro-Topf, unabhaengig davon wie
// viele Runden schon gelaufen sind.
function berechneTreatmentErgebnisse(versuch, daten) {
  const treatments = versuch.treatments || [];
  const samen = Number(versuch.samen_pro_topf || 36);
  const azGeplant = Number(versuch.az_geplant || 5);
  const byCode = {};
  treatments.forEach(t => { byCode[t.code] = { code: t.code, label: t.label || '', color: t.color || '#999', kfWerte: [] }; });

  (daten || []).forEach(d => {
    const code = (d.treatment || '').split(/[\s(]/)[0];
    if (!byCode[code]) return;
    let sum = 0, any = false;
    for (let a = 1; a <= azGeplant; a++) {
      const raw = d['az' + a + '_zahl'];
      if (raw !== '' && raw != null && !isNaN(Number(raw))) { sum += Number(raw); any = true; }
    }
    if (any) byCode[code].kfWerte.push(sum / samen * 100);
  });

  return Object.values(byCode).map(t => {
    const n = t.kfWerte.length;
    const mean = n ? t.kfWerte.reduce((a, b) => a + b, 0) / n : null;
    return { code: t.code, label: t.label, color: t.color, n, kf: mean == null ? null : Math.round(mean) };
  });
}

// Hoechste AZ-Runde, zu der irgendein Topf schon einen Wert hat - grobes Mass
// fuer den Fortschritt, unabhaengig vom Standort-Konzept.
function letzteErfassteAZ(daten, azGeplant) {
  let letzte = 0;
  (daten || []).forEach(d => {
    for (let a = azGeplant; a >= 1; a--) {
      const raw = d['az' + a + '_zahl'];
      if (raw !== '' && raw != null && !isNaN(Number(raw))) { if (a > letzte) letzte = a; break; }
    }
  });
  return letzte;
}

// Kategorie A-D aus dem Asana-Themenbereich (Forschungsplan-Sektionen "A)
// SYSTEM PELLET & SAATGUT", "B) PRAeDATION", "C) INFRASTRUKTUR",
// "D) DIREKTSAATVERSUCH" bzw. deren Unterabschnitte "A.0)", "D.1)" etc.) -
// nimmt den fuehrenden Buchstaben, alles ausserhalb A-D (z.B. "F) IDEEN")
// bleibt ohne Kategorie.
const KATEGORIE_LABEL = { A: 'System Pellet & Saatgut', B: 'Prädation', C: 'Infrastruktur', D: 'Direktsaatversuch' };
function kategorieVon(themenbereich) {
  const m = /^([A-D])[.\d]*\)/i.exec(String(themenbereich || '').trim());
  return m ? m[1].toUpperCase() : '';
}

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="status-msg">lädt…</div>';
  document.getElementById('header-sub').textContent = 'lädt…';
  try {
    // Faellt auf den Basis-Select zurueck, solange
    // supabase/auswertung-spalten.sql noch nicht ausgefuehrt wurde (die
    // Spalten `auswertung`/`auswertung_updated_at` also noch fehlen) - die
    // Tabelle bleibt so auch vor der Migration benutzbar, nur ohne
    // Auswertungs-Spalte.
    let { data, error } = await client
      .from('versuche')
      .select('versuchsnr, kfk_data, auswertung, auswertung_updated_at')
      .order('versuchsnr', { ascending: false });
    if (error && String(error.code) === '42703') {
      ({ data, error } = await client
        .from('versuche')
        .select('versuchsnr, kfk_data')
        .order('versuchsnr', { ascending: false }));
    }
    if (error) throw error;

    rows = (data || []).filter(row => !/^__.*__$/.test(row.versuchsnr || '')).map(row => {
      const snap = row.kfk_data || {};
      const v = snap.versuch || {};
      const daten = snap.daten || [];
      const azGeplant = Number(v.az_geplant || 5);
      return {
        versuchsnr: row.versuchsnr,
        v,
        titel: v.titel || '',
        art: v.baumart_kurz || v.baumart_lat || v.art || '',
        status: v.status || '',
        hypothese: v.hypothese || '',
        idNummer: v.id_nummer || '',
        ort: v.ort || '',
        verantwortlich: v.verantwortlich || '',
        postenNr: v.posten_nr || '',
        mddPp: v.mdd_pp || '',
        saatgutcharge: v.saatgutcharge || '',
        themenbereich: v.themenbereich || '',
        kategorie: kategorieVon(v.themenbereich),
        standorte: (typeof KfkStandorte !== 'undefined') ? KfkStandorte.migrateVersuchStandorte(v) : [],
        azGeplant,
        letzteAZ: letzteErfassteAZ(daten, azGeplant),
        treatmentErgebnisse: berechneTreatmentErgebnisse(v, daten),
        auswertung: row.auswertung || null,
        auswertungUpdatedAt: row.auswertung_updated_at || null
      };
    });

    document.getElementById('header-sub').textContent = rows.length + ' Versuche · Quelle: Supabase-Spiegelung';
    renderTable();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="status-msg err">Konnte Daten nicht laden: ' + esc(e.message || e) + '</div>';
    document.getElementById('header-sub').textContent = 'Fehler beim Laden';
  }
}

function auswertungBadge(r) {
  if (r.auswertung && (r.auswertung.zusammenfassung || r.auswertung.interpretation)) {
    return '<span class="badge ok">vorhanden</span>';
  }
  if (r.letzteAZ >= r.azGeplant && r.azGeplant > 0) {
    return '<span class="badge wait">ausstehend</span>';
  }
  return '<span class="badge none">läuft noch</span>';
}

function kfBarsHTML(r) {
  if (!r.treatmentErgebnisse.length) return '<span class="muted">—</span>';
  return '<div class="kf-bars">' + r.treatmentErgebnisse.map(t => `
    <div class="kf-bar-row">
      <span class="code" style="color:${esc(t.color)}">${esc(t.code)}</span>
      <div class="kf-bar-track"><div class="kf-bar-fill" style="width:${t.kf || 0}%;background:${esc(t.color)}"></div></div>
      <span class="pct">${t.kf == null ? '—' : t.kf + '%'}</span>
    </div>`).join('') + '</div>';
}

function standorteHTML(r) {
  const relevant = (r.standorte || []).filter(s => s.regal != null || s.boden != null);
  if (!relevant.length) return '<span class="muted">—</span>';
  return '<ul class="standorte-list">' + relevant.map(s =>
    `<li>Tray ${esc(s.tray)}: Regal ${s.regal == null ? '—' : esc(s.regal)}, Ebene/Boden ${s.boden == null ? '—' : esc(s.boden)}</li>`
  ).join('') + '</ul>';
}

function detailHTML(r) {
  const a = r.auswertung || {};
  const treatRows = r.treatmentErgebnisse.map(t => `
    <tr><td>${esc(t.code)} ${esc(t.label)}</td><td>${t.n}</td><td>${t.kf == null ? '—' : t.kf + '%'}</td></tr>
  `).join('') || '<tr><td colspan="3" class="muted">Keine Treatment-Daten</td></tr>';

  return `
    <div class="detail-grid">
      <div class="detail-block">
        <h4>Hypothese</h4>
        <p>${esc(r.hypothese) || '<span class="muted">—</span>'}</p>
      </div>
      <div class="detail-block">
        <h4>Dokumentation</h4>
        <p>Ort: ${esc(r.ort) || '—'}<br>Verantwortlich: ${esc(r.verantwortlich) || '—'}<br>AZ geplant: ${r.azGeplant} · erfasst bis AZ${r.letzteAZ}<br>
        Kategorie: ${r.kategorie ? esc(r.kategorie) + ') ' + esc(KATEGORIE_LABEL[r.kategorie] || '') : '—'}${r.themenbereich ? ' <span class="muted">(' + esc(r.themenbereich) + ')</span>' : ''}</p>
      </div>
      <div class="detail-block">
        <h4>Posten / Charge</h4>
        <p>Posten-Nr.: ${esc(r.postenNr) || '—'}<br>MDD/PP: ${esc(r.mddPp) || '—'}<br>Saatgutcharge: ${esc(r.saatgutcharge) || '—'}</p>
      </div>
      <div class="detail-block">
        <h4>Standort (Regal / Ebene je Tray)</h4>
        ${standorteHTML(r)}
      </div>
      <div class="detail-block">
        <h4>Auszählungsergebnisse (kumulativ)</h4>
        <table class="detail-table">
          <tr><th>Treatment</th><th>n</th><th>KF%</th></tr>
          ${treatRows}
        </table>
      </div>
      <div class="detail-block">
        <h4>Auswertung</h4>
        ${a.zusammenfassung ? `<p><strong>Zusammenfassung:</strong> ${esc(a.zusammenfassung)}</p>` : ''}
        ${a.interpretation ? `<p style="margin-top:8px"><strong>Interpretation:</strong> ${esc(a.interpretation)}</p>` : ''}
        ${a.empfehlung ? `<p style="margin-top:8px"><strong>Empfehlung:</strong> ${esc(a.empfehlung)}</p>` : ''}
        ${!a.zusammenfassung && !a.interpretation && !a.empfehlung ? '<p class="muted">Noch keine Auswertung hinterlegt.</p>' : ''}
        ${r.auswertungUpdatedAt ? `<div class="updated">Aktualisiert: ${new Date(r.auswertungUpdatedAt).toLocaleString('de-DE')}</div>` : ''}
      </div>
    </div>
  `;
}

let openRow = null;
function toggleRow(versuchsnr) {
  openRow = openRow === versuchsnr ? null : versuchsnr;
  renderTable();
}

// ============ Vergleichsfunktion ============
const compareSet = new Set();
function toggleCompare(versuchsnr, checked) {
  if (checked) compareSet.add(versuchsnr); else compareSet.delete(versuchsnr);
  updateCmpBar();
}
function updateCmpBar() {
  const bar = document.getElementById('cmp-bar');
  document.getElementById('cmp-count').textContent = compareSet.size;
  bar.classList.toggle('active', compareSet.size >= 2);
}
function clearCompare() {
  compareSet.clear();
  updateCmpBar();
  renderTable();
}
function closeCompare() {
  document.getElementById('cmp-overlay').style.display = 'none';
}
function openCompare() {
  const selected = rows.filter(r => compareSet.has(r.versuchsnr));
  if (selected.length < 2) return;

  const alleCodes = [];
  selected.forEach(r => r.treatmentErgebnisse.forEach(t => {
    if (!alleCodes.some(c => c.code === t.code)) alleCodes.push({ code: t.code, label: t.label });
  }));

  const headRow = '<tr><th>Merkmal</th>' + selected.map(r => `<th>${esc(r.versuchsnr)}</th>`).join('') + '</tr>';
  const rowsHTML = [
    ['Titel', r => esc(r.titel)],
    ['Art', r => esc(r.art)],
    ['Kategorie', r => r.kategorie ? esc(r.kategorie) + ') ' + esc(KATEGORIE_LABEL[r.kategorie] || '') : '—'],
    ['Status', r => esc(r.status)],
    ['Ort', r => esc(r.ort) || '—'],
    ['Posten-Nr.', r => esc(r.postenNr) || '—'],
    ['Saatgutcharge', r => esc(r.saatgutcharge) || '—'],
    ['AZ-Fortschritt', r => `${r.letzteAZ}/${r.azGeplant}`],
  ].map(([label, fn]) => `<tr><td><strong>${label}</strong></td>${selected.map(r => `<td>${fn(r)}</td>`).join('')}</tr>`).join('');

  const treatmentRows = alleCodes.map(c => {
    const cells = selected.map(r => {
      const t = r.treatmentErgebnisse.find(x => x.code === c.code);
      return `<td>${t && t.kf != null ? t.kf + '% <span class="muted">(n=' + t.n + ')</span>' : '—'}</td>`;
    }).join('');
    return `<tr><td><strong>${esc(c.code)}</strong> ${esc(c.label || '')}</td>${cells}</tr>`;
  }).join('') || '<tr><td colspan="' + (selected.length + 1) + '" class="muted">Keine Treatment-Daten</td></tr>';

  document.getElementById('cmp-content').innerHTML = `
    <table class="cmp-table">
      <thead>${headRow}</thead>
      <tbody>
        ${rowsHTML}
        <tr><td colspan="${selected.length + 1}"><h4 style="margin:10px 0 0">KF% je Treatment (kumulativ)</h4></td></tr>
        ${treatmentRows}
      </tbody>
    </table>
  `;
  document.getElementById('cmp-overlay').style.display = 'flex';
}

function sortRows(list) {
  const mode = document.getElementById('sortBy').value;
  const sorted = list.slice();
  if (mode === 'art') {
    sorted.sort((a, b) => String(a.art).localeCompare(String(b.art), 'de') || b.versuchsnr.localeCompare(a.versuchsnr));
  } else if (mode === 'kategorie') {
    sorted.sort((a, b) => (a.kategorie || 'Z').localeCompare(b.kategorie || 'Z') || b.versuchsnr.localeCompare(a.versuchsnr));
  } else {
    sorted.sort((a, b) => b.versuchsnr.localeCompare(a.versuchsnr));
  }
  return sorted;
}

function renderTable() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const filtered = sortRows(rows.filter(r =>
    !q || [r.versuchsnr, r.titel, r.art, r.status, r.kategorie].some(x => String(x || '').toLowerCase().includes(q))
  ));

  if (!filtered.length) {
    document.getElementById('content').innerHTML = '<div class="status-msg">Keine Versuche gefunden.</div>';
    return;
  }

  const trs = filtered.map(r => {
    const rowsHTML = [`
      <tr class="row-main">
        <td class="cmp-cell" onclick="event.stopPropagation()">
          <input type="checkbox" ${compareSet.has(r.versuchsnr) ? 'checked' : ''} onchange="toggleCompare('${esc(r.versuchsnr)}', this.checked)">
        </td>
        <td onclick="toggleRow('${esc(r.versuchsnr)}')"><strong>${esc(r.versuchsnr)}</strong>${r.idNummer ? `<div class="muted">ID ${esc(r.idNummer)}</div>` : ''}</td>
        <td onclick="toggleRow('${esc(r.versuchsnr)}')">${esc(r.titel)}</td>
        <td onclick="toggleRow('${esc(r.versuchsnr)}')">${esc(r.art)}</td>
        <td onclick="toggleRow('${esc(r.versuchsnr)}')">${r.kategorie ? `<span class="kategorie-badge">${esc(r.kategorie)}</span>` : '<span class="muted">—</span>'}</td>
        <td onclick="toggleRow('${esc(r.versuchsnr)}')">${esc(r.status)}</td>
        <td onclick="toggleRow('${esc(r.versuchsnr)}')">${r.letzteAZ}/${r.azGeplant}</td>
        <td onclick="toggleRow('${esc(r.versuchsnr)}')">${kfBarsHTML(r)}</td>
        <td onclick="toggleRow('${esc(r.versuchsnr)}')">${auswertungBadge(r)}</td>
      </tr>
    `];
    if (openRow === r.versuchsnr) {
      rowsHTML.push(`<tr class="detail-row"><td colspan="9">${detailHTML(r)}</td></tr>`);
    }
    return rowsHTML.join('');
  }).join('');

  document.getElementById('content').innerHTML = `
    <table class="ergebnisse">
      <thead>
        <tr>
          <th></th><th>Versuch</th><th>Titel</th><th>Art</th><th>Kategorie</th><th>Status</th><th>AZ</th><th>KF% je Treatment</th><th>Auswertung</th>
        </tr>
      </thead>
      <tbody>${trs}</tbody>
    </table>
  `;
}

loadData();
</script>
</body>
</html>
